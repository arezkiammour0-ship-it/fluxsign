name: signature
services:
  database:
    image: postgres:15
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U documenso -d documenso']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./pgdata:/var/lib/postgresql/data
  documenso:
    image: fluxsign:2.22.0-fs3
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 127.0.0.1:3010:3010
    volumes:
      - ./cert.p12:/opt/documenso/cert.p12:ro
